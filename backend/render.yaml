services:
  - type: web
    name: social-manager-ai-backend
    runtime: python:3.12
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: "8088"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TWILIO_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SOCIAL_MANAGER_DB_URL
        value: sqlite:///./social_manager.db
      - key: CORS_ORIGINS
        # Use a comma-separated string (not JSON) so Settings.cors_origins parses it correctly.
        value: "http://localhost:3000,http://localhost:5173,http://localhost:8088,https://social-manager-deployment.onrender.com,https://social-manager-7i2w44eww-markoaimarketingin-stacks-projects.vercel.app"
      - key: FRONTEND_URL
        value: "https://social-manager-7i2w44eww-markoaimarketingin-stacks-projects.vercel.app"
      - key: BACKEND_URL
        value: "https://social-manager-deployment.onrender.com"
